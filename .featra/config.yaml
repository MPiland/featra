# Featra project settings
version: 1
hierarchy: epic-feature-story-task
stages:
  - { name: New, category: not-started }
  - { name: Ready, category: not-started }
  - { name: In Progress, category: active }
  - { name: In Review, category: active }
  - { name: Acceptance, category: active }
  - { name: Done, category: done }
progress: stories        # stories | tasks
requireAccept: true   # Done also needs the user's Accept
baseBranch: main
worktrees: true
mcp: true
autoMerge: false      # M1b
uat: false            # M1b
knowledge: propose    # edit | propose | read-only
testReportArtifact: test-report-unit   # the JUnit report CI uploads (ci.yml), read to prove criteria
