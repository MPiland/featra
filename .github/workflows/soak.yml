# On-demand soak run: one spec (or the whole suite) repeated on one platform, stopping at the first failure and keeping
# its trace. Start it from the Actions tab or `gh workflow run soak.yml -f spec=tray.spec.ts -f platform=windows -f runs=150`.
name: Soak

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Spec file(s) under apps/desktop/e2e, space-separated; empty runs the whole suite.
        type: string
        default: ""
      platform:
        description: Runner OS.
        type: choice
        options: [windows, ubuntu]
        default: windows
      runs:
        description: How many times to run each test.
        type: number
        default: 20

run-name: Soak ${{ inputs.spec || 'full suite' }} on ${{ inputs.platform }} x${{ inputs.runs }}

permissions:
  contents: read

jobs:
  soak:
    name: Soak (${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          e2e: "true"
      - name: Soak
        shell: bash
        env:
          SPEC: ${{ inputs.spec }}
          RUNS: ${{ inputs.runs }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          [[ "$RUNS" =~ ^[1-9][0-9]*$ ]] || { echo "runs must be a positive whole number" >&2; exit 2; }
          read -ra specs <<<"$SPEC"
          cmd=(pnpm --filter @featra/desktop test:e2e "${specs[@]}" --repeat-each "$RUNS" --max-failures 1)
          if [ "$PLATFORM" = ubuntu ]; then cmd=(tooling/e2e/xvfb.sh "${cmd[@]}"); fi
          "${cmd[@]}"
      - name: Upload the failing run's trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ inputs.platform }}-traces
          path: apps/desktop/test-results
          retention-days: 30
          if-no-files-found: ignore
