# The checks main's branch protection requires (decisions.md, 2026-11-07): Gate, E2E (Windows), E2E (Ubuntu), and
# E2E (macOS) once it passes on main (decisions.md, 2026-11-18). Renaming a job renames its check, so branch protection
# must be updated with it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    # Well above the hang guard below, so a hung test fails by name and its report still uploads (BUG-28).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Format, lint, typecheck and unit tests
        run: pnpm check
        env:
          # Every unit test's time limit (tooling/hang-guard.ts).
          FEATRA_HANG_GUARD_MS: "300000"
          # A JUnit report of the unit tests as well, which Featra reads to prove criteria (STORY-57).
          FEATRA_JUNIT: test-report/unit.xml
      - name: Upload the unit test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-unit
          path: test-report
          retention-days: 14
          if-no-files-found: ignore

  e2e-windows:
    name: E2E (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          e2e: "true"
      - name: E2E suite
        shell: bash
        run: pnpm test:e2e
        env:
          FEATRA_JUNIT: test-report/e2e-windows.xml
      # A JUnit report of the e2e tests, read with the other platforms' reports to prove criteria (STORY-63).
      - name: Upload the e2e test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-e2e-windows
          path: test-report
          retention-days: 14
          if-no-files-found: ignore
      # A failed test's window screenshots, app trace with DOM snapshots and runner trace (BUG-30, docs/testing.md).
      - name: Upload screenshots and traces of failed tests
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-traces
          path: apps/desktop/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload screens for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screens-windows
          path: apps/desktop/test-results/ux
          retention-days: 7
          if-no-files-found: ignore

  e2e-ubuntu:
    name: E2E (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          e2e: "true"
      - name: E2E suite under Xvfb and Openbox
        run: tooling/e2e/xvfb.sh pnpm test:e2e
        env:
          FEATRA_JUNIT: test-report/e2e-ubuntu.xml
      # A JUnit report of the e2e tests, read with the other platforms' reports to prove criteria (STORY-63).
      - name: Upload the e2e test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-e2e-ubuntu
          path: test-report
          retention-days: 14
          if-no-files-found: ignore
      # A failed test's window screenshots, app trace with DOM snapshots and runner trace (BUG-30, docs/testing.md).
      - name: Upload screenshots and traces of failed tests
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ubuntu-traces
          path: apps/desktop/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload screens for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screens-ubuntu
          path: apps/desktop/test-results/ux
          retention-days: 7
          if-no-files-found: ignore

  e2e-macos:
    name: E2E (macOS)
    # Apple silicon (arm64).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          e2e: "true"
      - name: E2E suite
        run: pnpm test:e2e
        env:
          FEATRA_JUNIT: test-report/e2e-macos.xml
      # A JUnit report of the e2e tests, read with the other platforms' reports to prove criteria (STORY-63).
      - name: Upload the e2e test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-e2e-macos
          path: test-report
          retention-days: 14
          if-no-files-found: ignore
      # A failed test's window screenshots, app trace with DOM snapshots and runner trace (BUG-30, docs/testing.md).
      - name: Upload screenshots and traces of failed tests
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-macos-traces
          path: apps/desktop/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload screens for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screens-macos
          path: apps/desktop/test-results/ux
          retention-days: 7
          if-no-files-found: ignore

  # The installers (STORY-64, ADR 0040): each job builds its platform's installer with `pnpm package`, installs it as a
  # tester would and launches the installed app (apps/desktop/e2e/installed), and uploads the installer. Not required
  # checks (decisions.md, 2026-11-18).
  package-windows:
    name: Package (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          e2e: "true"
      - name: Build the installer
        shell: bash
        run: pnpm package
      - name: Install it and launch the installed app
        shell: bash
        run: pnpm test:installed
        env:
          FEATRA_JUNIT: test-report/package-windows.xml
      - name: Upload the installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: apps/desktop/out/installers/*-setup.exe
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the smoke test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-package-windows
          path: test-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload screenshots and traces of failed tests
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-traces
          path: apps/desktop/test-results
          retention-days: 14
          if-no-files-found: ignore

  package-ubuntu:
    name: Package (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # CI has no FUSE to mount the AppImage: it unpacks itself and runs.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          e2e: "true"
      - name: Build the installer
        run: pnpm package
      - name: Install it and launch the installed app under Xvfb and Openbox
        run: tooling/e2e/xvfb.sh pnpm test:installed
        env:
          FEATRA_JUNIT: test-report/package-ubuntu.xml
      - name: Upload the installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-ubuntu
          path: apps/desktop/out/installers/*.AppImage
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the smoke test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-package-ubuntu
          path: test-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload screenshots and traces of failed tests
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: package-ubuntu-traces
          path: apps/desktop/test-results
          retention-days: 14
          if-no-files-found: ignore

  package-macos:
    name: Package (macOS)
    # Apple silicon (arm64); Rosetta runs the app's Intel half.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          e2e: "true"
      - name: Install Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
      - name: Build the installer
        run: pnpm package
      - name: Install it and launch the installed app
        run: pnpm test:installed
        env:
          FEATRA_JUNIT: test-report/package-macos.xml
      - name: Upload the installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: |
            apps/desktop/out/installers/*.dmg
            apps/desktop/out/installers/*.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the smoke test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-package-macos
          path: test-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload screenshots and traces of failed tests
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: package-macos-traces
          path: apps/desktop/test-results
          retention-days: 14
          if-no-files-found: ignore
